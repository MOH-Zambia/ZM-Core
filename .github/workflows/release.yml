name: Release publication

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release site
    permissions:
      contents: write
    uses: ./.github/workflows/main.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      deploy: true
      target_folder: releases/${{ github.event.release.tag_name || inputs.tag }}
